[package]
name = "brrrrr-lake"
description = "brrrrr's tables in files and object stores: ad-hoc SQL over Parquet, CSV and JSON, local or on S3, GCS, Azure and HTTP."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
arrow-array = "60"
arrow-buffer = "60"
arrow-cast = "60"
arrow-csv = "60"
arrow-ipc = "60"
arrow-json = "60"
arrow-schema = "60"
arrow-select = "60"
brrrrr-core = { path = "../brrrrr-core" }
# Iceberg's Avro manifests (snappy, zstandard) and Delta's Parquet checkpoints: crates the
# Parquet reader builds anyway
bytes = "1"
flate2 = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.3"
# JSON lines: their keys in order, and which text values are times
# a query's conditions, read to skip the partitions they drop
sqlparser = { version = "0.63", features = ["visitor"] }
serde_json = { version = "1", features = ["preserve_order"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure", "http"] }
# a CSV reader's `nullstr`: the texts that are NULL
regex = "1"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap", "lz4", "flate2-rust_backend", "simdutf8"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
snap = "1"
url = "2"
zstd = "0.14"

[dev-dependencies]
tempfile = "3"
