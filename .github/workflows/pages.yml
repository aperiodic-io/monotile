name: pages
# The website (website/, built by website/build.py with the cookbook and the benchmark) on GitHub
# Pages: built on every pull request that touches it (the build checks every internal link),
# deployed from main.
on:
  pull_request:
    paths: [website/**, fixtures/cookbook/**, bench/sql/results.json, scripts/install.sh]
  push:
    branches: [main]
    paths: [website/**, fixtures/cookbook/**, bench/sql/results.json, scripts/install.sh]
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 website/build.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: website/_site }
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
