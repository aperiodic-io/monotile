# `cargo deny check` (CI's deny job): every dependency's licence is one an Apache-2.0 binary may
# ship, no crate has a security advisory, and every crate comes from crates.io.
[graph]
all-features = true

[advisories]
# unmaintained crates are a warning, not a failure: there is often nothing to move to
unmaintained = "none"

[licenses]
allow = [
  "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0",
  "CC0-1.0", "CDLA-Permissive-2.0", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Unlicense", "Zlib",
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
