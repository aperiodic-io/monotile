[package]
name = "sealed"
description = "The infrastructure's side of the POCs: runners, module hosts, the mock KMS and enclave."
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
age = "0.11"
anyhow = "1"
brrrrr-core = { path = "../../../crates/brrrrr-core" }
brrrrr-lake = { path = "../../../crates/brrrrr-lake" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
libloading = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
sha2 = "0.10"
sqlparser = "0.63"
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime"] }

[features]
# An enclave that also prints the query: what an operator would build to read it (POC 6).
leak = []
